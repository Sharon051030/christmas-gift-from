.wrap{max-width:980px;margin:auto;padding:30px 24px 48px;position:relative}.lights{display:block;width:100%;height:auto;overflow:visible}.bulb{animation:glow 2.8s ease-in-out infinite alternate}.bulb:nth-child(3n){animation-delay:-1.4s}@keyframes glow{to{opacity:.55;filter:drop-shadow(0 0 7px #fff)}}
header{text-align:center;position:relative;padding:12px 12px 0}.eyebrow{letter-spacing:.24em;font-size:12px;color:#855b46;font-weight:700}h1{font-size:clamp(38px,7vw,78px);line-height:1.05;color:#bc4840;margin:12px 0 4px;letter-spacing:-.04em;transform:rotate(-2deg);font-family:"Segoe Print","Comic Sans MS",cursive}.hero-img{width:100%;max-height:260px;object-fit:cover;border-radius:18px;border:2px solid var(--ink);margin:16px 0}.hero-img[hidden]{display:none}.parade{display:flex;align-items:center;justify-content:center;gap:clamp(3px,2vw,22px);margin:4px auto 18px}.parade .doodle{width:clamp(38px,9vw,80px);height:auto;aspect-ratio:1;animation:bob 4s ease-in-out infinite}.parade .doodle:nth-child(2n){animation-delay:-2s}@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
.frame{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:29px 22px 32px 24px;padding:18px;box-shadow:5px 7px 0 #a8773930;isolation:isolate}.frame:before{content:"";position:absolute;inset:7px;border:2px dashed #d95d50;border-radius:23px 17px 26px 19px;pointer-events:none;z-index:-1}.ribbon{position:relative;width:max-content;max-width:90%;margin:-37px auto 17px;background:#e66b59;border:2px solid var(--ink);padding:8px 24px;color:#fffdf1;font-weight:bold;letter-spacing:.12em;transform:rotate(-1deg);box-shadow:2px 3px 0 #473c3220}.form-area{background:#fff;border-radius:14px;overflow:hidden;position:relative}.corner{position:absolute;z-index:2;pointer-events:none;width:65px;height:65px}.tl{left:-27px;top:-33px;transform:rotate(-15deg)}.tr{right:-27px;top:-33px;transform:rotate(15deg)}.bl{left:-23px;bottom:-22px;transform:rotate(-9deg)}.br{right:-23px;bottom:-22px;transform:rotate(9deg)}.fallback{text-align:center;font-size:13px;padding:15px 8px 0}.fallback a{color:#865140;text-underline-offset:4px}.footer-art{display:flex;justify-content:center;gap:12px;margin-top:24px}.footer-art .doodle{width:55px;height:55px}footer{text-align:center;font-size:12px;letter-spacing:.12em;margin-top:16px;color:#795844}.snow-toggle{position:fixed;right:12px;bottom:12px;z-index:6;border:1.5px solid var(--ink);border-radius:20px;background:#fffbed;color:var(--ink);padding:8px 12px;cursor:pointer;font:inherit;font-size:12px}button:focus-visible,a:focus-visible{outline:3px solid #396d9b;outline-offset:3px}
@media(max-width:600px){.wrap{padding:16px 12px 46px}.frame{padding:10px;border-radius:19px}.frame:before{inset:4px;border-radius:14px}.corner{width:45px;height:45px}.tl,.bl{left:-9px}.tr,.br{right:-9px}.tl,.tr{top:-25px}.bl,.br{bottom:-17px}.ribbon{margin-top:-30px;font-size:13px}header{padding-bottom:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>

<script>
// ====== 只需要修改這裡 ======
const CONFIG = {
  themeImage: '', // 例如 './christmas-banner.jpg'，留空則不顯示
  snowDensity: 125,
  snowSpeed: 1,
  snowColor: '#ffffff'
};
// ====== 自訂主題圖片 ======
if(CONFIG.themeImage){const img=document.getElementById('heroImage');img.src=CONFIG.themeImage;img.hidden=false;img.addEventListener('error',()=>img.hidden=true);}
// ====== 手繪燈串 ======
const ns='http://www.w3.org/2000/svg', lights=document.getElementById('lights');
const colors=['#e87865','#f6cb55','#88b96e','#83c5d2'];
for(let i=0;i<24;i++){const x=18+i*37.5,t=(x%225)/225,y=5+174*t*(1-t);const g=document.createElementNS(ns,'g');g.setAttribute('transform',`translate(${x} ${y}) rotate(${(t-.5)*-40})`);g.setAttribute('class','bulb');const cap=document.createElementNS(ns,'rect');for(const [k,v] of Object.entries({x:-4,y:-1,width:8,height:6,rx:2,fill:'#473c32'}))cap.setAttribute(k,v);const bulb=document.createElementNS(ns,'path');for(const [k,v] of Object.entries({d:'M-4 4 Q-13 17 0 23 Q13 17 4 4Z',fill:colors[i%4],stroke:'#473c32','stroke-width':1.8}))bulb.setAttribute(k,v);g.append(cap,bulb);lights.append(g);}
// ====== Canvas 飄雪 ======
const canvas=document.getElementById('snow'),ctx=canvas.getContext('2d'),toggle=document.getElementById('snowToggle');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');let enabled=!reduced.matches,w=0,h=0,flakes=[],raf=0,last=0;
const rand=(a,b)=>a+Math.random()*(b-a);
function makeFlake(initial=false){return{x:rand(0,w),y:initial?rand(0,h):rand(-70,-8),r:rand(1.2,4.1),vy:rand(18,55),vx:rand(-8,8),phase:rand(0,Math.PI*2),sway:rand(5,17),opacity:rand(.35,.85),star:Math.random()<.12};}
function resize(){w=innerWidth;h=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const n=Math.max(12,Math.round(CONFIG.snowDensity*Math.min(1,w/900)));flakes=Array.from({length:n},()=>makeFlake(true));}
function drawFlake(f){ctx.globalAlpha=f.opacity;ctx.fillStyle=CONFIG.snowColor;ctx.strokeStyle=CONFIG.snowColor;ctx.shadowColor='#ffffff';ctx.shadowBlur=2;if(f.star){ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<3;i++){const a=i*Math.PI/3;ctx.moveTo(f.x-Math.cos(a)*f.r*1.7,f.y-Math.sin(a)*f.r*1.7);ctx.lineTo(f.x+Math.cos(a)*f.r*1.7,f.y+Math.sin(a)*f.r*1.7);}ctx.stroke();}else{ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();}}
function animate(now){raf=0;if(!enabled||document.hidden)return;const dt=last?Math.min((now-last)/1000,.05):0;last=now;ctx.clearRect(0,0,w,h);for(let i=0;i<flakes.length;i++){let f=flakes[i];f.phase+=dt*.8;f.x+=(f.vx+Math.sin(f.phase)*f.sway)*dt*CONFIG.snowSpeed;f.y+=f.vy*dt*CONFIG.snowSpeed;if(f.y>h+12){flakes[i]=f=makeFlake();}if(f.x<-15)f.x=w+15;if(f.x>w+15)f.x=-15;drawFlake(f);}ctx.globalAlpha=1;raf=requestAnimationFrame(animate);}
function sync(){cancelAnimationFrame(raf);raf=0;last=0;ctx.clearRect(0,0,w,h);toggle.textContent=enabled?'❄ 關閉飄雪':'❄ 開啟飄雪';toggle.setAttribute('aria-pressed',String(enabled));if(enabled&&!document.hidden)raf=requestAnimationFrame(animate);}
resize();sync();addEventListener('resize',resize);toggle.addEventListener('click',()=>{enabled=!enabled;sync();});document.addEventListener('visibilitychange',sync);reduced.addEventListener('change',e=>{enabled=!e.matches;sync();});
</script>
